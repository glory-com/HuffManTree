<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>动态哈夫曼树可视化 (自动居中版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #282c34;
            color: #abb2bf;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; color: #61afef; }
        
        #controls {
            margin: 20px auto;
            padding: 20px;
            background: #3c3f41;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        #inputChar {
            padding: 10px;
            font-size: 18px;
            width: 60px;
            text-align: center;
            border: 2px solid #61afef;
            border-radius: 4px;
            background: #282c34;
            color: #fff;
            outline: none;
        }
        
        button {
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            background: #98c379;
            color: #282c34;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #7dbf56; }
        button.reset { background: #e06c75; color: #fff; }
        button.reset:hover { background: #d44d5a; }

        #inputStream {
            font-family: 'Courier New', monospace;
            color: #e5c07b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #huffmanCanvas {
            border: 2px solid #4f5358;
            background: #1e1e1e; /* 画布背景 */
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* SVG 样式 */
        .node circle { fill: #61afef; stroke: #fff; stroke-width: 2px; }
        .node rect { fill: #98c379; stroke: #fff; stroke-width: 2px; }
        .node text { font-family: Arial; font-weight: bold; font-size: 12px; fill: #000; pointer-events: none; }
        .link { stroke: #abb2bf; stroke-width: 2px; }
        .link-label { font-size: 12px; fill: #e06c75; font-weight: bold; }
    </style>
</head>
<body>

    <h1>动态哈夫曼树可视化</h1>
    <p>输入字符，观察哈夫曼树如何<b>实时重构</b>并保持<b>居中对齐</b></p>

    <div id="controls">
        <input type="text" id="inputChar" maxlength="1" placeholder="A" autocomplete="off">
        <button onclick="processChar()">输入 (Enter)</button>
        <button class="reset" onclick="resetTree()">重置</button>
        <br><br>
        <div>当前输入流: <span id="inputStream"></span></div>
    </div>
    
    <svg id="huffmanCanvas" width="1000" height="600"></svg>

    <script>
        // ==========================================
        // 1. 基础数据结构 (Node & MinHeap)
        // ==========================================
        class Node {
            constructor(char, freq, left = null, right = null) {
                this.char = char; 
                this.freq = freq;
                this.left = left;
                this.right = right;
                this.x = 0; 
                this.y = 0; 
            }
            isLeaf() { return this.left === null && this.right === null; }
        }

        class MinHeap {
            constructor(comparator = (a, b) => a.freq - b.freq) {
                this._heap = [];
                this._comparator = comparator;
            }
            size() { return this._heap.length; }
            push(item) { this._heap.push(item); this._bubbleUp(); }
            pop() {
                if (this.size() === 0) return null;
                const top = this._heap[0];
                const last = this._heap.pop();
                if (this.size() > 0) {
                    this._heap[0] = last;
                    this._bubbleDown();
                }
                return top;
            }
            _bubbleUp() {
                let index = this.size() - 1;
                while (index > 0) {
                    let parentIndex = Math.floor((index - 1) / 2);
                    if (this._comparator(this._heap[index], this._heap[parentIndex]) < 0) {
                        [this._heap[index], this._heap[parentIndex]] = [this._heap[parentIndex], this._heap[index]];
                        index = parentIndex;
                    } else break;
                }
            }
            _bubbleDown() {
                let index = 0;
                while (true) {
                    let left = 2 * index + 1, right = 2 * index + 2, smallest = index;
                    if (left < this.size() && this._comparator(this._heap[left], this._heap[smallest]) < 0) smallest = left;
                    if (right < this.size() && this._comparator(this._heap[right], this._heap[smallest]) < 0) smallest = right;
                    if (smallest !== index) {
                        [this._heap[index], this._heap[smallest]] = [this._heap[smallest], this._heap[index]];
                        index = smallest;
                    } else break;
                }
            }
        }

        // ==========================================
        // 2. 核心逻辑 (Coder)
        // ==========================================
        class Coder {
            constructor() {
                this.freqs = new Map();
                this.root = null;
                this.inputStream = "";
                this.canvas = document.getElementById('huffmanCanvas');
                this.coords = []; // 存储所有节点以便二次渲染
            }

            process(char) {
                this.inputStream += char;
                this.freqs.set(char, (this.freqs.get(char) || 0) + 1);
                this.buildTree();
                this.draw();
            }

            buildTree() {
                if (this.freqs.size === 0) { this.root = null; return; }
                const pq = new MinHeap();
                for (const [char, freq] of this.freqs) pq.push(new Node(char, freq));

                if (pq.size() === 1) { // 特殊情况：只有1个字符
                    const only = pq.pop();
                    this.root = new Node('\0', only.freq, only, null);
                    return;
                }

                while (pq.size() > 1) {
                    const left = pq.pop();
                    const right = pq.pop();
                    const parent = new Node('\0', left.freq + right.freq, left, right);
                    pq.push(parent);
                }
                this.root = pq.pop();
            }

            // ==========================================
            // 3. 完美的居中绘图逻辑
            // ==========================================
            draw() {
                this.canvas.innerHTML = ''; // 清空画布
                this.coords = [];
                if (!this.root) return;

                let leafX = 0; // 相对坐标起点
                const NODE_SPACING = 70; // 叶子节点间距
                const LAYER_HEIGHT = 80; // 层级高度

                // --- 步骤 A: 递归计算相对坐标 (Post-Order) ---
                const calculateRelativePos = (node, depth) => {
                    if (!node) return;

                    // 1. 先算子树
                    calculateRelativePos(node.left, depth + 1);
                    calculateRelativePos(node.right, depth + 1);

                    // 2. 后算自己
                    if (node.isLeaf()) {
                        node.x = leafX;
                        leafX += NODE_SPACING;
                    } else {
                        // 内部节点位于左右孩子的中心
                        node.x = (node.left.x + node.right.x) / 2;
                    }
                    node.y = depth * LAYER_HEIGHT + 50; // 顶部留白50px
                    this.coords.push(node);
                };

                calculateRelativePos(this.root, 0);

                // --- 步骤 B: 计算全局偏移量 (Centering) ---
                // 获取画布真实宽度 (兼容性写法)
                const canvasWidth = this.canvas.clientWidth || parseInt(this.canvas.getAttribute('width'));
                const canvasCenterX = canvasWidth / 2;
                
                // 核心：算出根节点当前X和画布中心X的差值
                const offsetX = canvasCenterX - this.root.x;

                // --- 步骤 C: 应用偏移并绘制 ---
                for (const node of this.coords) {
                    node.x += offsetX; // 平移

                    // 绘制连线
                    if (node.left) this.drawLine(node, node.left, '0');
                    if (node.right) this.drawLine(node, node.right, '1');

                    // 绘制节点
                    this.drawNode(node);
                }
            }

            drawNode(node) {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('node');
                g.setAttribute('transform', `translate(${node.x}, ${node.y})`);

                // 处理显示文本
                let displayChar = node.char;
                if (node.char === ' ') displayChar = 'Space';
                else if (node.char === '\0') displayChar = ''; // 内部节点不显示字符

                if (node.isLeaf() && node.char !== '\0') {
                    // 叶子节点：矩形
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', -25); rect.setAttribute('y', -15);
                    rect.setAttribute('width', 50); rect.setAttribute('height', 30);
                    rect.setAttribute('rx', 5); // 圆角
                    g.appendChild(rect);
                } else {
                    // 内部节点：圆形
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('r', 18);
                    g.appendChild(circle);
                }

                // 文本：字符(频率)
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                if (node.isLeaf()) {
                    text.textContent = `${displayChar}:${node.freq}`;
                } else {
                    text.textContent = node.freq; // 内部节点只显示频率
                }
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dy', '.35em'); // 垂直居中微调
                g.appendChild(text);

                this.canvas.appendChild(g);
            }

            drawLine(p, c, label) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.classList.add('link');
                line.setAttribute('x1', p.x); line.setAttribute('y1', p.y);
                line.setAttribute('x2', c.x); line.setAttribute('y2', c.y);
                this.canvas.insertBefore(line, this.canvas.firstChild); // 线条画在节点后面

                // 0/1 标签
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.classList.add('link-label');
                text.textContent = label;
                text.setAttribute('x', (p.x + c.x) / 2);
                text.setAttribute('y', (p.y + c.y) / 2 - 5);
                text.setAttribute('text-anchor', 'middle');
                this.canvas.appendChild(text);
            }

            reset() {
                this.freqs.clear();
                this.root = null;
                this.inputStream = "";
                this.canvas.innerHTML = '';
            }
        }

        // ==========================================
        // 4. 交互绑定
        // ==========================================
        const coder = new Coder();
        const inputEl = document.getElementById('inputChar');
        const streamEl = document.getElementById('inputStream');

        function processChar() {
            const char = inputEl.value; // 不去除空格，允许输入空格
            if (char.length === 1) {
                coder.process(char);
                streamEl.textContent = coder.inputStream;
                inputEl.value = '';
                inputEl.focus();
            } else {
                alert("请输入单个字符");
            }
        }

        function resetTree() {
            coder.reset();
            streamEl.textContent = "";
            inputEl.value = '';
            inputEl.focus();
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processChar();
        });
        
        // 初始化焦点
        inputEl.focus();

    </script>
</body>
</html>
